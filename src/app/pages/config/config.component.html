<div class="config-page-container">
  <header class="hero-banner">
    <h1>CONFIGURACIÓN DE GUERRERO</h1>
  </header>

  <main class="config-content">
    <aside class="profile-sidebar">
      <div class="avatar-container">
        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed={{ userName() }}" alt="Avatar">
        <div class="edit-badge" title="Cambiar Avatar" (click)="onEditAvatar()">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </div>
      </div>
      <div class="username-display">
        <h2>{{ userName() }}</h2>
      </div>
    </aside>

    <section class="config-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [ngModel]="userEmail()" (ngModelChange)="userEmail.set($event)" placeholder="tu@email.com">
      </div>

      <div class="form-group">
        <label>Seguridad</label>
        <div class="action-card">
          <div class="card-row">
            <div class="info">
              <p class="label">Contraseña</p>
            </div>
            <button class="btn btn-outline btn-sm" (click)="onChangePassword()">GESTIONAR CLAVE</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Preferencias</label>
        <div class="action-card glass-style">
          <div class="card-row divider">
            <div class="info">
              <p class="label">Lengua del Clan</p>
              <p class="description">{{ language() === 'ES' ? 'Español (ES)' : 'English (EN)' }}</p>
            </div>
            <button class="btn btn-outline btn-sm secondary" (click)="onChangeLanguage()">CAMBIAR IDIOMA</button>
          </div>
          <div class="card-row">
            <div class="info">
              <p class="label">Modo Oscuro</p>
              <p class="description">Actívalo para descansar la vista</p>
            </div>
            <div class="toggle-switch" [class.active]="isDarkMode()" (click)="isDarkMode.set(!isDarkMode())">
              <div class="toggle-knob"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-secondary" (click)="onCancel()">DESCARTAR</button>
        <button class="btn btn-gold" (click)="onSave()">GUARDAR CAMBIOS</button>
      </div>
    </section>
  </main>
</div>
