<div class="scrim" (click)="onClose()"></div>

<div class="aviso-modal">
  <!-- Icono de advertencia vikingo -->
  <div class="warning-icon">
    <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" 
         stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
      <line x1="12" y1="9" x2="12" y2="13"></line>
      <line x1="12" y1="17" x2="12.01" y2="17"></line>
    </svg>
  </div>

  <h2 class="modal-title">{{ displayTitle() }}</h2>
  
  <p class="modal-message">{{ message() }}</p>

  <button class="btn-confirm" (click)="onClose()">
    {{ 'LOBBY.MODALS.FULL.BTN' | translate }}
  </button>
</div>
