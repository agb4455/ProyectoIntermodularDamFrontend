<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <!-- Cabecera del Modal -->
    <header class="modal-header">
      <div class="header-title">
        <span class="header-icon">📜</span>
        <h2>{{ 'GAME.ACTIONS.LOG' | translate | uppercase }}</h2>
      </div>
      <button class="btn-close" (click)="onClose()" [title]="'CONFIG.BTN_CANCEL' | translate">✕</button>
    </header>

    <!-- Barra de Herramientas -->
    <div class="log-toolbar">
      <div class="filter-buttons">
        <button 
          class="filter-btn" 
          [class.active]="filteredType() === 'all'"
          (click)="setFilter('all')">
          📋 {{ 'GAME.LOG.FILTERS.ALL' | translate }}
        </button>
        <button 
          class="filter-btn" 
          [class.active]="filteredType() === 'attack'"
          (click)="setFilter('attack')">
          ⚔️ {{ 'GAME.LOG.FILTERS.ATTACK' | translate }}
        </button>
        <button 
          class="filter-btn" 
          [class.active]="filteredType() === 'train'"
          (click)="setFilter('train')">
          👷 {{ 'GAME.LOG.FILTERS.TRAIN' | translate }}
        </button>
        <button 
          class="filter-btn" 
          [class.active]="filteredType() === 'research'"
          (click)="setFilter('research')">
          🧪 {{ 'GAME.LOG.FILTERS.RESEARCH' | translate }}
        </button>
      </div>
      <div class="log-controls">
        <button 
          class="control-btn"
          [class.enabled]="autoScroll()"
          (click)="toggleAutoScroll()"
          [title]="'GAME.LOG.AUTO_SCROLL' | translate">
          {{ autoScroll() ? '🔽' : '⬆️' }}
        </button>
      </div>
    </div>

    <!-- Lista de Logs -->
    <div class="logs-container">
      @if (displayedLogs().length === 0) {
        <div class="empty-logs">
          <p>{{ 'GAME.TRAIN.EMPTY_LOG' | translate }}</p>
        </div>
      } @else {
        <div class="logs-list">
          @for (log of displayedLogs(); track log.id) {
            <div class="log-entry animate-in" [attr.data-type]="log.type">
              <div class="log-time">{{ log.timestamp }}</div>
              <div class="log-icon">{{ getLogIcon(log.type) }}</div>
              <div class="log-message">
                <span class="performer">[{{ log.performer }}]</span>
                <span class="action">{{ log.action }}</span>
              </div>
              <!-- Decoración según tipo -->
              <div class="log-indicator" [attr.data-type]="log.type"></div>
            </div>
          }
        </div>
      }
    </div>

    <!-- Pie del Modal -->
    <footer class="modal-footer">
      <button class="btn-secondary" (click)="onClose()">{{ 'LOBBY.MODALS.FULL.BTN' | translate }}</button>
    </footer>
  </div>
</div>
