<!-- CREAR PARTIDA MODAL — CrearPartidaModalComponent -->

<!-- Scrim de fondo — click fuera cierra el modal -->
<div class="modal-overlay" (click)="close()" [attr.aria-label]="'CONFIG.BTN_CANCEL' | translate"></div>

<div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">

  <!-- Botón cerrar -->
  <button class="btn-close" (click)="close()" [attr.aria-label]="'CONFIG.BTN_CANCEL' | translate">✕</button>

  <!-- Cabecera -->
  <header class="modal-header">
    <h2 class="modal-title" id="modal-title">{{ 'LOBBY.MODALS.CREATE.TITLE' | translate }}</h2>
    <p class="modal-subtitle">{{ 'LOBBY.MODALS.CREATE.SUBTITLE' | translate }}</p>
  </header>

  <!-- Grid de clanes -->
  <div class="clanes-grid">
    @for (clan of clanes(); track clan.id) {
      <button
        class="clan-card"
        [class.selected]="selectedClan() === clan.id"
        [attr.data-clan]="clan.id"
        (click)="selectClan(clan.id)"
        [attr.aria-pressed]="selectedClan() === clan.id"
        [attr.aria-label]="('LOBBY.MODALS.CREATE.SELECT_CLAN' | translate) + ' ' + clan.name"
        id="clan-{{ clan.id }}"
      >
        <span class="clan-icon" aria-hidden="true">{{ clan.icon }}</span>
        <span class="clan-name">{{ clan.name }}</span>
        <span class="clan-archetype">{{ 'GAME.troop_types.' + clan.archetype | translate }}</span>
        <div class="selected-indicator" aria-hidden="true"></div>
      </button>
    }
  </div>

  <!-- Mensaje de selección -->
  <p class="selection-hint">
    @if (selectedClan()) {
      <span class="hint-active">{{ 'LOBBY.MODALS.CREATE.HINT_ACTIVE' | translate }}</span>
    } @else {
      <span class="hint-empty">{{ 'LOBBY.MODALS.CREATE.HINT_EMPTY' | translate }}</span>
    }
  </p>

  <!-- Botón CTA -->
  <footer class="modal-footer">
    <button
      class="btn-create"
      id="btn-crear-partida"
      [disabled]="!selectedClan() || isCreating()"
      (click)="createGame()"
    >
      @if (isCreating()) {
        <span class="creating-spinner" aria-hidden="true"></span>
        {{ 'LOBBY.MODALS.CREATE.FORGING' | translate }}
      } @else {
        {{ 'LOBBY.MODALS.CREATE.BTN' | translate }}
      }
    </button>
  </footer>

</div>
