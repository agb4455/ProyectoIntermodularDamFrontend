<div class="config-page-container">
    <header class="header">
        <h1>CONFIGURACIÓN</h1>
    </header>
    
    <div class="main-layout">
        <aside class="sidebar">
            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed={{ userName() }}" alt="Avatar" class="avatar-preview">
            <div style="text-align: center;">
                <h2 style="margin: 0; font-family: 'Cinzel', serif; color: var(--color-gold);">{{ userName() }}</h2>
                <p style="margin: 5px 0; color: var(--color-text-secondary); font-size: 0.9rem;">{{ userClan() }}</p>
            </div>
            <button class="btn btn-ghost" style="border: 1px solid var(--color-gold); color: var(--color-gold); font-size: 0.7rem; padding: 0.5rem 1rem;" (click)="onEditAvatar()">CAMBIAR AVATAR</button>
        </aside>

        <div class="form-scroll-area">
            <section class="card">
                <div class="card-header">IDENTIDAD</div>
                <div class="form-row stack-mobile">
                    <div class="info-txt">
                        <span class="label">Correo Sagrado</span>
                        <span class="desc">Tu vínculo con el Valhalla</span>
                    </div>
                    <input type="email" [ngModel]="userEmail()" (ngModelChange)="userEmail.set($event)" class="viking-input">
                </div>
            </section>

            <section class="card">
                <div class="card-header">SEGURIDAD</div>
                <div class="form-row">
                    <div class="info-txt">
                        <span class="label">Contraseña</span>
                        <span class="desc">Asegura tu acceso</span>
                    </div>
                    <button class="btn btn-ghost btn-mobile-small" style="border: 1px solid var(--color-gold); color: var(--color-gold); font-family: 'Outfit';" (click)="onChangePassword()">CAMBIAR CLAVE</button>
                </div>
            </section>

            <section class="card">
                <div class="card-header">PREFERENCIAS</div>
                <div class="form-row">
                    <div class="info-txt">
                        <span class="label">Lengua del Clan</span>
                        <span class="desc">Idioma de la batalla</span>
                    </div>
                    <div class="flag-selector">
                        <button class="flag-btn" [class.active]="language() === 'ES'" (click)="setLanguage('ES')">🇪🇸</button>
                        <button class="flag-btn" [class.active]="language() === 'EN'" (click)="setLanguage('EN')">🇬🇧</button>
                    </div>
                </div>
                <div class="form-row" style="margin-top: 1rem;">
                    <div class="info-txt">
                        <span class="label">Modo Oscuro</span>
                        <span class="desc">Noche eterna</span>
                    </div>
                    <div class="toggle-switch" [class.active]="isDarkMode()" (click)="toggleTheme()"></div>
                </div>
            </section>
        </div>
    </div>

    <footer class="footer">
        <button class="btn btn-ghost" (click)="onCancel()">DESCARTAR</button>
        <button class="btn btn-gold" (click)="onSave()">GUARDAR CAMBIOS</button>
    </footer>
</div>

@if (showPasswordModal()) {
    <app-cambiar-contrasena-modal (closeModal)="onPasswordModalClosed()"></app-cambiar-contrasena-modal>
}
