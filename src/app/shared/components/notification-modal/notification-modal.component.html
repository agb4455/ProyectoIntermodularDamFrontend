@if (isOpen() && config(); as cfg) {
  <!-- Scrim (fondo oscuro con blur) -->
  <div class="notification-scrim" (click)="onScrimClick()"></div>

  <!-- Card del modal -->
  <div class="notification-modal" [attr.data-variant]="cfg.variant" role="alertdialog" aria-modal="true">

    <!-- Icono dinámico según variante -->
    <div class="modal-icon">
      @switch (cfg.variant) {
        @case ('warning') {
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        }
        @case ('success') {
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
        }
        @case ('error') {
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        }
        @case ('confirm') {
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        }
        @case ('info') {
          <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        }
      }
    </div>

    <!-- Título -->
    <h2 class="modal-title">{{ cfg.title }}</h2>

    <!-- Mensaje -->
    <p class="modal-message">{{ cfg.message }}</p>

    <!-- Botones -->
    <div class="modal-actions" [class.modal-actions--dual]="cfg.variant === 'confirm'">
      @if (cfg.variant === 'confirm') {
        <!-- Confirm: dos botones -->
        <button class="btn-modal btn-modal--cancel" (click)="onCancel()">
          {{ cancelButtonText() }}
        </button>
        <button class="btn-modal btn-modal--confirm-destructive" (click)="onConfirm()">
          {{ confirmButtonText() }}
        </button>
      } @else {
        <!-- Resto: un solo botón -->
        <button class="btn-modal btn-modal--primary" (click)="onConfirm()">
          {{ confirmButtonText() }}
        </button>
      }
    </div>
  </div>
}
