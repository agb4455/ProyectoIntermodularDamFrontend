<nav class="navbar">
  <div class="logo-section" [routerLink]="['/']">
    <app-logo [scale]="0.45" [showText]="true" [direction]="'horizontal'"></app-logo>
  </div>

  <div class="nav-group">
    <a [routerLink]="['/']" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Home</a>
    @if (authService.isLoggedIn()) {
      <a [routerLink]="['/lobby']" routerLinkActive="active" class="nav-link">Lobby</a>
    }
    <a [routerLink]="['/personajes']" routerLinkActive="active" class="nav-link">Personajes</a>
    <a [routerLink]="['/reglas']" routerLinkActive="active" class="nav-link">Reglas</a>
  </div>
  
  <div class="navbar-actions">
    <!-- Menú de usuario -->
    <div class="user-menu" title="Perfil / Menú de Usuario">
      <div class="user-avatar" (click)="handleUserClick()">
        <svg fill="currentColor" viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
        </svg>
      </div>

      @if (dropdownOpen() && authService.isLoggedIn()) {
        <div class="dropdown-content">
          <a [routerLink]="['/config']" class="dropdown-item" (click)="closeDropdown()">Configuración</a>
          <a [routerLink]="['/stats/user']" class="dropdown-item" (click)="closeDropdown()">Estadísticas</a>
          @if (authService.isAdmin()) {
            <a [routerLink]="['/admin']" class="dropdown-item" (click)="closeDropdown()">Administración</a>
          }
          <div class="dropdown-divider"></div>
          <a [routerLink]="['/signin']" class="dropdown-item danger" (click)="closeDropdown()" (click)="authService.clearSession()">Salir de la cuenta</a>
        </div>
      }
    </div>
  </div>

  @if (authModalOpen()) {
    <app-auth [isModal]="true" (closeModal)="authModalOpen.set(false)"></app-auth>
  }
</nav>
